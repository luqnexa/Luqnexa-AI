name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: python scripts/train-native.py --check
      - run: python scripts/test-import-chatgpt-lessons.py
      - run: python scripts/test-learning-dashboard.py
      - run: python scripts/test-app-learning.py
      - run: python scripts/test-romaji-practice.py
      - run: python scripts/test-train-context.py
      - run: python scripts/test-train-literature.py
      - run: python -m unittest discover -s tests -p test_local_ai_server.py
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - run: cargo test --workspace --locked
